name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Secret scanning needs full history to catch anything committed and later
# "removed" but still present in an earlier commit, not just the working
# tree — see the secrets job below.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (build, test, clippy, audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # rustsec/audit-check tries to publish its findings as a check run,
      # which needs this beyond the default (read-only) GITHUB_TOKEN scope
      # this repo has — confirmed live: without it the step still ran the
      # actual audit correctly, then failed afterward on "Resource not
      # accessible by integration" trying to create the check run.
      checks: write
    defaults:
      run:
        working-directory: mint-sniper
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Matters because Cargo.toml isn't at the repo root —
          # Swatinem/rust-cache's default (".") would look for it in the
          # wrong place. Confirmed via this step's own "Cache Key"/
          # "Lockfiles considered" log output pointing at
          # mint-sniper/Cargo.lock, not assumed from the docs.
          #
          # THIS KEY WAS ACCIDENTALLY DELETED by the 9g commit that added
          # the comment block below it — leaving `with:` followed by only
          # comments, which GitHub's workflow parser rejects outright
          # ("Invalid workflow file ... Unexpected value ''"). That broke
          # EVERY CI run on this branch from 9g's own commit through 10h's
          # (13 runs, zero jobs ever executed in any of them — the parse
          # failure happens before any job is dispatched, not inside one).
          # Restored here; see CLAUDE.md's Known Gaps / process-fix note
          # for the full incident writeup.
          workspaces: mint-sniper
          #
          # `cache-bin: true` (the default, left implicit) is what actually
          # matters for cargo audit's ~5min-per-run compile-from-source
          # problem, since rustsec/audit-check's own `cargo install
          # cargo-audit` writes the resulting binary to the same
          # ~/.cargo/bin this action caches. Confirmed with real numbers,
          # not assumed from the config alone: two runs against an
          # unchanged Cargo.lock (this branch's own CI history, 9g) —
          # cargo build 64s -> 17s, cargo audit ~175s (full source compile)
          # -> 4s (cached binary, no compile at all). One earlier pair of
          # consecutive runs on this branch showed "No cache found" despite
          # an unchanged Cargo.lock and a prior successful save — possibly
          # a propagation-delay or scope quirk in GitHub's cache backend,
          # not this config; not chased further since the very next pair
          # showed a clean hit with the numbers above. This does NOT speed
          # up a fresh Claude Code sandbox session's local `cargo build` —
          # that starts cold every time regardless — this is purely a
          # CI-run-to-CI-run cache.

      - name: cargo build
        run: cargo build --all-targets

      - name: cargo test
        run: cargo test

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # `uses:` steps do NOT inherit this job's `defaults.run.working-
          # directory: mint-sniper` — that only applies to `run:` steps.
          # Confirmed live (see the failed CI run this comment replaces):
          # the action ran from the checkout root and failed with
          # "Couldn't load ./Cargo.lock" since the real file is at
          # mint-sniper/Cargo.lock. rustsec/audit-check's own `action.yml`
          # (checked directly, not assumed) exposes `working-directory`
          # for exactly this — "The directory of the Cargo.toml /
          # Cargo.lock files to scan," defaulting to `.`.
          working-directory: mint-sniper
          # RUSTSEC-2025-0137 and RUSTSEC-2026-0220 (both in `ruint`,
          # transitive via alloy-primitives) were suppressed by advisory ID
          # from here through step 9 — see git history for that commit's
          # full reasoning — until the alloy 0.9.2 -> 2.4.1 upgrade (step 9)
          # pulled in alloy-primitives 1.6.1, which permits ruint >=1.20.0
          # (both advisories' fixed version) instead of pinning it at
          # 1.16.0. `cargo audit` was clean on this Cargo.lock as of that
          # upgrade — confirmed directly, not assumed from the version bump
          # alone. See CLAUDE.md's known-gaps list, formerly gap #12,
          # resolved as of step 9.
          #
          # RUSTSEC-2023-0071 (rsa crate, "Marvin Attack" timing
          # side-channel in RSA decryption) is a NEW addition here, found
          # live running `cargo audit` locally while investigating the CI
          # failure streak this comment sits inside of — not something step
          # 9 could have caught, since it arrived with step 10c's
          # `openidconnect` dependency (Google Sign-In), added after step 9.
          # `rsa` is pulled in as one of `openidconnect`'s *default*
          # features (confirmed via `cargo tree -e features -i rsa`) — it's
          # what verifies Google's RS256-signed ID tokens, not an optional
          # or swappable piece. `cargo audit` reports "No fixed upgrade is
          # available" for this advisory as of this writing; there is no
          # newer `rsa` version, no alternate JWT-verification feature flag
          # on `openidconnect`, and no reasonable non-blocking way to
          # sidestep it. Suppressed by advisory ID, same pattern as the two
          # ruint advisories above, pending an upstream fix — revisit this
          # `ignore:` entry whenever `openidconnect`/`rsa` are next bumped,
          # the same way the ruint suppression was revisited and removed at
          # step 9 once its upstream fix actually shipped.
          ignore: RUSTSEC-2023-0071

  ui:
    name: UI (typecheck, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mint-sniper/ui
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mint-sniper/ui/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm run typecheck
        run: npm run typecheck

      - name: npm run build
        run: npm run build

      - name: npm audit
        # --omit=dev: audits only what ships in ui/dist. Explicit, checked
        # decision, not a blanket weakening. STEP 21d — re-checked directly
        # against a fresh `npm audit`, not assumed still accurate from this
        # comment's original count: the full (dev+prod) tree now carries
        # THREE advisories, all still dev-only and all still the same
        # category as the original one this comment described — `vite`
        # <=6.4.2 (GHSA-4w7w-66w2-5vf9 path traversal in optimized-deps
        # `.map` handling; GHSA-v6wh-96g9-6wx3, a `launch-editor`
        # NTLMv2-hash-disclosure Windows-only dev-server issue; GHSA-fx2h-
        # pf6j-xcff, high, a `server.fs.deny` bypass on Windows alternate
        # paths — all three are `vite dev`-server-reachable only, one is
        # Windows-specific on top of that), plus the original transitive
        # `esbuild` <=0.24.2 / GHSA-67mh-4wv8-2f99 dev-server advisory this
        # comment already covered. None of the three ship in `ui/dist` —
        # confirmed live with `npm audit --omit=dev --audit-level=moderate`
        # itself (0 vulnerabilities) against the actual command this step
        # runs, not inferred from the dependency tree by eye. The only
        # available fix for any of them is still vite 8.x — `npm audit fix`
        # (no --force) confirms no non-breaking fix exists; `--force` would
        # install vite@8.2.2, a major version bump unverified against this
        # project's actual `npm run build`/`npm run dev` usage, and is not
        # something to force through this comment alone. Revisit --omit=dev
        # (or bump to vite 8 and drop it, with real build/dev testing) next
        # time dependencies are deliberately touched. Fails on any
        # moderate-or-higher advisory in production dependencies — those DO
        # ship, so there's no equivalent excuse to soften that half of the
        # check.
        run: npm audit --omit=dev --audit-level=moderate

  deploy-scripts:
    name: Deploy scripts (shell tests)
    runs-on: ubuntu-latest
    # STEP 15c FOLLOW-UP — no shell-script test harness existed anywhere
    # in this repo before this job; the other two jobs only ever touch
    # Rust/UI code, confirmed by reading this file, not assumed. Added
    # after a real bug (benchmark-token.sh crashing on cast's
    # bracket-annotated integer output) reached the live VPS uncaught —
    # see deploy/tests/test-benchmark-token.sh's own header for the full
    # incident. Plain bash, no new dependency (ubuntu-latest ships bash,
    # sed, grep by default) — deliberately not reaching for bats or any
    # other framework for what's currently a single test file.
    steps:
      - uses: actions/checkout@v4

      - name: deploy/tests/test-benchmark-token.sh
        run: mint-sniper/deploy/tests/test-benchmark-token.sh

      # STEP 15e FOLLOW-UP — three more tests added alongside the
      # config-swap/restore automation added to run-benchmark.sh. The
      # root-required, systemd-restarting orchestration in that script
      # itself genuinely can't run in CI (no real bot, no systemd unit
      # to restart) — these test the parts that CAN run anywhere: the
      # extracted, pure-logic pieces (deploy/lib/*.py) and the bash
      # backup/restore idioms, in isolation, against scratch
      # files/mocked JSON. See DEPLOY.md §9 for the operator-run
      # verification steps covering what these can't reach.
      - name: deploy/tests/test-swap-config-to-testnet.py
        run: python3 mint-sniper/deploy/tests/test-swap-config-to-testnet.py

      - name: deploy/tests/test-check-wallet-balances.py
        run: python3 mint-sniper/deploy/tests/test-check-wallet-balances.py

      - name: deploy/tests/test-config-backup-restore.sh
        run: mint-sniper/deploy/tests/test-config-backup-restore.sh

      # STEP 15e FOLLOW-UP #2 — a real crash found live on fire 1/15 of
      # an actual n=15 run (the mint pipeline itself was confirmed
      # correct via journalctl — this was purely a result-parsing bug
      # in run-benchmark.sh). See deploy/lib/find_mint_result.sh's
      # header for the full root cause.
      - name: deploy/tests/test-find-mint-result.sh
        run: mint-sniper/deploy/tests/test-find-mint-result.sh

      # STEP 15 FOLLOW-UP — investigation tooling for the real,
      # unexplained dispatch_to_inclusion_ms finding (a confirmed
      # PUSH-path fire measuring ~12x step 14b's 227ms testnet block
      # time). See deploy/lib/diagnose_inclusion_delay.py's header.
      - name: deploy/tests/test-diagnose-inclusion-delay.py
        run: python3 mint-sniper/deploy/tests/test-diagnose-inclusion-delay.py

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not just the pushed diff — a secret committed and
          # then "removed" in a later commit is still sitting in history and
          # still just as compromised. This is the single highest-value
          # check in this whole workflow given this project's own CLAUDE.md
          # security rules exist because exactly that happened once already
          # in a sibling project (see AbiaEats' CLAUDE.md) — don't skip this
          # even though 7a already did a one-time manual pass.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
