# Copy to config.toml. NEVER commit config.toml — it holds private_key_env
# NAMES (and other env-var names), never the private keys themselves.
# Keys live in the environment; this file must not.

# STEP 17 — the key goes in the URL PATH (as shown), never before the
# host as `wss://user:pass@host/...` or `wss://user@host/...` userinfo.
# alloy's WS client auto-detects URL userinfo and silently turns it into
# an HTTP Authorization header on connect — a provider like Alchemy
# doesn't expect that and will reject it with an opaque, auth-flavored
# error (a live deploy lost over an hour to this exact confusion before
# it was traced to a corrupted config value). Config::validate() now
# rejects this shape outright, but keep the key in the path regardless.
ws_rpc_url = "wss://eth-mainnet.g.alchemy.com/v2/YOUR_KEY"
# Multiple HTTP RPCs raced in parallel on broadcast — redundancy against a single
# provider lagging at the exact moment mint flips.
http_rpc_urls = [
  "https://eth-mainnet.g.alchemy.com/v2/YOUR_KEY",
  "https://rpc.flashbots.net/fast",
  "https://mainnet.infura.io/v3/YOUR_KEY",
]

# Empty = unset. When set, fire_prepared submits eth_sendRawTransaction
# here first, then fans out to http_rpc_urls as backup. See the Robinhood
# example below.
sequencer_http_url = ""

# Optional WS URL for post-fire inclusion PUSH. Empty = ws_rpc_url.
# Alchemy eth_subscription PUSH means receipt-seen-by-this-RPC, not
# sequencer-included. Do NOT point this at wss://feed.*.chain.robinhood.com
# (Nitro feed, not an eth WS).
inclusion_ws_url = ""

# STEP 14a — only sizes the HTTP-fallback poll interval
# inclusion::wait_for_receipt uses when it can't establish a WS push
# subscription for post-fire receipt detection. Default (12000) matches
# mainnet's ~12s blocks; set this to the REAL block time of whatever
# chain you're targeting, e.g. 100 for Robinhood Chain (confirmed via
# real consecutive block timestamps, step 13d/14b) — see CLAUDE.md's
# step 14 section. Does NOT affect trigger_mode = "poll_state" (step
# 13c), which reacts to every block push unconditionally regardless of
# this value.
block_time_ms = 12000
# How long inclusion::wait_for_receipt waits for a fired tx's receipt
# (push or HTTP-fallback poll) before reporting a timed-out result
# instead of hanging indefinitely. Must be >= block_time_ms.
inclusion_timeout_ms = 30000

# "custom" (arbitrary project mint(), config below) or "seadrop" (fixed
# ISeaDrop.mintPublic ABI — see src/seadrop.rs, and the seadrop-mode
# example commented out at the bottom of this file).
mint_mode = "custom"

contract_address = "0x000000000000000000000000000000000000dEaD"

# ABI fragment for the mint call you'll actually send. Adjust selector + args
# per-project — this is the single most common reason a sniper silently fails.
mint_fn_signature = "mint(uint256)"
mint_fn_args_template = ["1"]   # quantity per wallet, as strings

# View function polled every block to detect the mint flipping live.
# Leave empty and set trigger_mode = "timestamp" to fire on a known block time instead.
mint_state_fn_signature = "mintActive()"
trigger_mode = "poll_state"      # "poll_state" | "timestamp" | "mempool_watch"
trigger_timestamp_unix = 0        # used only if trigger_mode = "timestamp"

# Required only if trigger_mode = "mempool_watch": the project's known
# admin/owner wallet. Fires the moment a pending tx FROM this address TO
# the watched contract is seen — before it's even confirmed. Needs
# ws_rpc_url to be a node that exposes full mempool visibility (Geth
# 1.11+, newPendingTransactions with full tx bodies); many free/public
# RPCs don't support this even over WS, and arming will fail loudly
# (auto-disarm + a clear error) rather than silently watching nothing if
# the subscription isn't available. See watcher.rs's run_mempool_watcher
# doc comment for exactly which contract "watched contract" means in
# seadrop mode (it's the nft contract, not the SeaDrop singleton).
#
# HOW TO FIND THIS FOR A PROJECT YOU DON'T CONTROL — do NOT use the
# contract's deployer address from Etherscan's "Contract Creator" field.
# Verified directly against SeaDrop's source (ERC721ContractMetadata.sol
# inherits TwoStepOwnable from ProjectOpenSea/utility-contracts): ownership
# is explicitly transferable, and it's routine practice to deploy from a
# disposable hot wallet and then move ownership to a cold wallet or
# multisig before the drop goes live — exactly the scenario TwoStepOwnable
# exists to make safe. The deployer address only tells you who paid gas to
# deploy; it says nothing about who holds owner() now or who will call the
# enable function later. Instead, call the nft contract's owner() view
# function (standard on any Ownable-family contract, which this is)
# yourself, as close to arm-time as practical — ownership can change again
# after you check, so this is a live fact to verify, not a historical one
# to look up once.
mint_enable_admin = ""

# --- seadrop-mode-only fields, ignored when mint_mode = "custom" ---
seadrop_address = ""              # blank = mainnet/Polygon default, see seadrop.rs
nft_contract = ""                 # the actual collection contract for this drop
fee_recipient = ""                # must be project-approved if restrictFeeRecipients=true
quantity_per_wallet = 1

# Gas strategy. Free mint = no backrun risk, so bias aggressive.
priority_fee_multiplier = 6.0     # multiplies current suggested priority fee
max_priority_fee_gwei_cap = 15.0
gas_limit_headroom_pct = 20        # added on top of eth_estimateGas dry run

# Anti-clustering jitter applied per-wallet at broadcast time.
# On Ethereum mainnet this spreads N wallets so they don't cluster.
# On Robinhood Chain race_mode this must be 0 (validate rejects jitter_ms_max > 0).
race_mode = false
jitter_ms_min = 40
jitter_ms_max = 400
gas_jitter_pct = 8

[[wallets]]
private_key_env = "SNIPER_PK_1"   # read from environment, never stored in this file

[[wallets]]
private_key_env = "SNIPER_PK_2"

[[wallets]]
private_key_env = "SNIPER_PK_3"

# --- Example: targeting a SeaDrop public-stage free mint instead ---
# mint_mode = "seadrop"
# nft_contract = "0xTheProjectsCollectionContract"
# fee_recipient = "0x0000a26b00c1F0DF003000390027140000fAa719"  # OpenSea's official recipient, common default
# quantity_per_wallet = 1
# trigger_timestamp_unix left at 0 — the bot reads the real startTime from
# getPublicDrop(nftContract) at boot and arms for that exact second.
# contract_address / mint_fn_signature / mint_state_fn_signature are unused
# in this mode (mint target is the SeaDrop singleton, ABI is fixed).

# --- Example: targeting Robinhood Chain (P0 race-mode) ---
# chain_id is still read live from the RPC at prepare time, never hardcoded.
# seadrop_address's mainnet/Polygon default is confirmed on RH — SEE 13a in
# CLAUDE.md before a real mint.
#
# Sequencer-first submit (P0.2). Testnet alternative (commented):
#   sequencer_http_url = "https://sequencer.testnet.chain.robinhood.com"
# sequencer_http_url = "https://sequencer.mainnet.chain.robinhood.com"
#
# Public RH RPC as the inclusion/read path + backup submit. Alchemy is an
# optional last backup (commented) — its PUSH is receipt-seen-by-this-RPC,
# not sequencer-included.
# http_rpc_urls = [
#   "https://rpc.mainnet.chain.robinhood.com",
#   # "https://robinhood-mainnet.g.alchemy.com/v2/YOUR_KEY",
# ]
# ws_rpc_url = "wss://robinhood-mainnet.g.alchemy.com/v2/YOUR_KEY"
# inclusion_ws_url = ""  # empty = ws_rpc_url. Do NOT use wss://feed.*.chain.robinhood.com
#
# Testnet RPCs:
#   https://rpc.testnet.chain.robinhood.com
#   wss://robinhood-testnet.g.alchemy.com/v2/YOUR_KEY
# Faucet: https://faucet.testnet.chain.robinhood.com
# Explorer: https://explorer.testnet.chain.robinhood.com
#
# P0.1 — race_mode zeros fire-path jitter. validate() rejects race_mode
# with jitter_ms_max > 0.
# race_mode = true
# jitter_ms_min = 0
# jitter_ms_max = 0
# gas_jitter_pct = 0
#
# P0.4 — RH block time. validate() errors if this config looks like RH
# (sequencer_http_url set or a chain.robinhood.com host) and block_time_ms
# is still the 12000 mainnet default.
# block_time_ms = 227
# inclusion_timeout_ms = 5000
#
# trigger_mode = "timestamp" is the $0 SeaDrop speed trigger (exact
# startTime, no extra eth_call). poll_state waits an extra eth_call on a
# lagged head — don't use it as the RH race trigger.
# trigger_mode = "timestamp"

# --- InkChain (step 22) — SeaDrop's singleton is confirmed deployed at
# the same address as above on InkChain MAINNET (real eth_getCode call,
# not assumed from the cross-chain deterministic-address theory) — it is
# NOT deployed at that address on InkChain testnet as of step 22's
# check, so a live testnet dry run needs a different, project-supplied
# SeaDrop address if one exists. chain_id is read live at prepare time
# (executor.rs), never hardcoded, same as every other chain here. See
# CLAUDE.md's "InkChain support" section before relying on this for a
# real mint, not just this comment — in particular its mempool-
# visibility finding, which affects whether trigger_mode =
# "mempool_watch" / copymint can be used on this chain at all.
#
# Mainnet (chain id 57073):
# ws_rpc_url = "wss://ink-mainnet.g.alchemy.com/v2/YOUR_KEY"
# http_rpc_urls = ["https://ink-mainnet.g.alchemy.com/v2/YOUR_KEY"]
#
# Testnet / Ink Sepolia (chain id 763373) — SeaDrop not confirmed
# deployed here as of step 22; treat as an explorer-only sanity check,
# not a dry-run target, until that's resolved:
# ws_rpc_url = "wss://ink-sepolia.g.alchemy.com/v2/YOUR_KEY"
# http_rpc_urls = ["https://ink-sepolia.g.alchemy.com/v2/YOUR_KEY"]
# Explorer: https://explorer-sepolia.inkonchain.com
#
# STEP 22b — InkChain's real block time, measured the same way as
# Robinhood Chain's (50 consecutive mainnet block timestamps, not the
# documented figure — InkChain's own docs don't publish one at all):
# a consistent 1000ms per block. See CLAUDE.md's step 22 section for
# the measurement and its 1-second-timestamp-granularity caveat.
# block_time_ms = 1000

# --- Copymint (step 6) — watch tracked wallets for SeaDrop mintPublic
# activity and mint the same collection ourselves. SeaDrop-only, always
# runs in the background independent of trigger_mode/armed state above —
# see src/copymint.rs's doc comment for the full design and its safety
# model. Empty by default: copymint does nothing until tracked_wallets is
# populated. NOT live-fire-verified from this authoring environment (see
# CLAUDE.md's "copymint" section and known gap #11) — validate on testnet
# before trusting this for a real drop.
tracked_wallets = []              # e.g. ["0xSomeWalletYouWantToCopy", ...]

# Free copymint opportunities (mint_price_wei == 0, verified fresh via
# getPublicDrop, never guessed) can auto-fire out of the box — downside
# is bounded to gas, same ceiling as max_priority_fee_gwei_cap above.
copymint_auto_fire_free = true

# Paid copymint opportunities NEVER auto-fire regardless of this value —
# see copymint.rs's should_auto_fire, which doesn't even take this field
# as a parameter. This only controls whether the UI offers a one-click
# manual fire button for a specific paid opportunity.
copymint_auto_fire_paid = false

# Hard ceiling (wei, TOTAL value = price * quantity_per_wallet, not
# per-token) above which a paid copymint opportunity is never offered as
# fireable — checked independently of copymint_auto_fire_paid, both when
# the opportunity is first surfaced and again, fresh, at manual-fire time.
# 0 = nothing paid is fireable until you raise this deliberately.
max_copymint_price_wei = 0

# --- identity (step 10c) — Google Sign-In. Leave all three empty/unset
# to leave identity disabled entirely (existing bearer-token-only
# behavior, unchanged) — the app boots and runs exactly as before.
# All three must be set together or not at all (Config::validate rejects
# a partial set). See CLAUDE.md's "Identity (step 10)" section.
google_oauth_client_id = ""             # e.g. "123-abc.apps.googleusercontent.com" — NOT a secret, from Google Cloud Console
google_oauth_client_secret_env = ""     # env var NAME (not the value) holding the OAuth Client Secret, e.g. "GOOGLE_OAUTH_CLIENT_SECRET"
google_oauth_redirect_url = ""          # must exactly match a Redirect URI registered on the OAuth client, e.g. "https://sniper.your-tailnet.ts.net:4117/auth/google/callback"
